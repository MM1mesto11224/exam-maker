plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openexam.maker'
    compileSdk 34

    defaultConfig {
        applicationId "org.openexam.maker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // ملفات الويب هي المصدر الوحيد للتطبيق: نفس مجلد web يُستخدم في المتصفح وفي الأندرويد
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
